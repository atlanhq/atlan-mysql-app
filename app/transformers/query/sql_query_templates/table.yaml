# table.yaml
table: Table
columns:
  attributes:
    name:
      source_query: table_name
    qualifiedName:
      source_query: concat(connection_qualified_name, '/', table_catalog, '/', table_schema, '/', table_name)
      source_columns: [connection_qualified_name, table_catalog, table_schema, table_name]
    tableName:
      source_query: |
        CASE
          WHEN CAST(is_partition AS BOOLEAN) = TRUE THEN parent_table_name
          ELSE NULL
        END
      source_columns: [parent_table_name, is_partition]
    tableQualifiedName:
      source_query: |
        CASE
          WHEN CAST(is_partition AS BOOLEAN) = TRUE THEN concat(connection_qualified_name, '/', table_catalog, '/', table_schema, '/', parent_table_name)
          ELSE NULL
        END
      source_columns: [connection_qualified_name, table_catalog, table_schema, parent_table_name, is_partition]
    connectionQualifiedName:
      source_query: connection_qualified_name
    connectionName:
      source_query: connection_name
    description:
      source_query: |
        CASE
          WHEN remarks IS NOT NULL THEN REGEXP_REPLACE(
            REGEXP_REPLACE(
              REGEXP_REPLACE(
                REGEXP_REPLACE(SUBSTRING(COALESCE(remarks, ''), 1, 100000), '<[^>]+>', ''),
              '\s+', ' '),
            '^ ', ''),
            ' $', '')
          ELSE NULL
        END
      source_columns: [remarks]
    databaseName:
      source_query: table_catalog
    databaseQualifiedName:
      source_query: concat(connection_qualified_name, '/', table_catalog)
      source_columns: [connection_qualified_name, table_catalog]
    schemaName:
      source_query: table_schema
    schemaQualifiedName:
      source_query: concat(connection_qualified_name, '/', table_catalog, '/', table_schema)
      source_columns: [connection_qualified_name, table_catalog, table_schema]
    definition:
      source_query: |
        CASE
          WHEN table_type = 'VIEW' THEN CONCAT('CREATE OR REPLACE VIEW ', table_name, ' AS ', COALESCE(view_definition, 'None'))
          ELSE view_definition
        END
      source_columns: [table_type, table_name, view_definition]
    columnCount:
      source_query: column_count
    rowCount:
      source_query: |
        CASE
          WHEN table_type = 'VIEW' OR row_count IS NULL THEN NULL
          ELSE CAST(COALESCE(row_count, 0) AS INTEGER)
        END
      source_columns: [row_count, table_type]
    sizeBytes:
      source_query: size_bytes
    isPartitioned:
      source_query: |
        CASE
          WHEN table_type = 'VIEW' THEN FALSE
          WHEN CAST(is_partition AS BOOLEAN) = TRUE THEN TRUE
          ELSE FALSE
        END
      source_columns: [is_partition, table_type]
    parentTable:
      typeName:
        source_query: |
          CASE
            WHEN CAST(is_partition AS BOOLEAN) = TRUE THEN 'Table'
            ELSE NULL
          END
        source_columns: [is_partition]
      uniqueAttributes:
        qualifiedName:
          source_query: |
            CASE
              WHEN CAST(is_partition AS BOOLEAN) = TRUE THEN concat(connection_qualified_name, '/', table_catalog, '/', table_schema, '/', parent_table_name)
              ELSE NULL
            END
          source_columns: [connection_qualified_name, table_catalog, table_schema, parent_table_name, is_partition]
    partitionList:
      source_query: |
        CASE
          WHEN partitions IS NOT NULL THEN SUBSTRING(partitions, 1, 255)
          ELSE NULL
        END
      source_columns: [partitions]
    partitionStrategy:
      source_query: COALESCE(partition_strategy, NULL)
      source_columns: [partition_strategy]
    partitionCount:
      source_query: |
        CASE
          WHEN partition_count IS NOT NULL THEN CAST(COALESCE(partition_count, 0) AS INTEGER)
          ELSE NULL
        END
      source_columns: [partition_count]
    constraint:
      source_query: COALESCE(partition_constraint, NULL)
      source_columns: [partition_constraint]
    tenantId:
      source_query: tenant_id
    lastSyncWorkflowName:
      source_query: last_sync_workflow_name
    lastSyncRun:
      source_query: last_sync_run
    lastSyncRunAt:
      source_query: last_sync_run_at
    connectorName:
      source_query: connector_name
    atlanSchema:
      typeName:
        source_query: |
          CASE
            WHEN CAST(is_partition AS BOOLEAN) != TRUE THEN 'Schema'
            ELSE NULL
          END
        source_columns: [is_partition]
      uniqueAttributes:
        qualifiedName:
          source_query: |
            CASE
              WHEN CAST(is_partition AS BOOLEAN) != TRUE THEN concat(connection_qualified_name, '/', table_catalog, '/', table_schema)
              ELSE NULL
            END
          source_columns: [connection_qualified_name, table_catalog, table_schema, is_partition]
    sourceCreatedAt:
      source_query: |
        CASE
          WHEN create_time IS NOT NULL THEN CAST(create_time AS TIMESTAMP)
          ELSE NULL
        END
      source_columns: [create_time]
    subType:
      source_query: |
        CASE
          WHEN table_type = 'BASE TABLE' THEN 'TABLE'
          WHEN table_type = 'VIEW' THEN NULL
          ELSE table_type
        END
      source_columns: [table_type]
  customAttributes:
    engine:
      source_query: COALESCE(engine, '')
      source_columns: [engine]
    version:
      source_query: |
        CASE
          WHEN version IS NOT NULL THEN
            CASE
              WHEN CAST(version AS VARCHAR) LIKE '%.0' THEN REGEXP_REPLACE(CAST(version AS VARCHAR), '\\.0$', '')
              WHEN CAST(version AS VARCHAR) LIKE '%.00' THEN REGEXP_REPLACE(CAST(version AS VARCHAR), '\\.00$', '')
              WHEN CAST(version AS VARCHAR) LIKE '%.000' THEN REGEXP_REPLACE(CAST(version AS VARCHAR), '\\.000$', '')
              ELSE CAST(version AS VARCHAR)
            END
          ELSE ''
        END
      source_columns: [version]
    is_transient:
      source_query: "''"
    row_format:
      source_query: COALESCE(row_format, '')
      source_columns: [row_format]
    data_length:
      source_query: |
        CASE
          WHEN data_length IS NOT NULL THEN CAST(CAST(COALESCE(data_length, 0) AS INTEGER) AS VARCHAR)
          ELSE NULL
        END
      source_columns: [data_length]
    auto_increment:
      source_query: |
        CASE
          WHEN auto_increment IS NOT NULL THEN CAST(CAST(COALESCE(auto_increment, 0) AS INTEGER) AS VARCHAR)
          ELSE NULL
        END
      source_columns: [auto_increment]
    table_collation:
      source_query: COALESCE(table_collation, '')
      source_columns: [table_collation]
    create_options:
      source_query: COALESCE(create_options, '')
      source_columns: [create_options]
  typeName:
    source_query: |
      CASE
        WHEN table_type IN ('TABLE', 'BASE TABLE') THEN 'Table'
        ELSE 'View'
      END
    source_columns: [table_type]
  status:
    source_query: "'ACTIVE'"
