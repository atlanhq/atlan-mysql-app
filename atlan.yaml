name: mysql
display_name: "Mysql"
type: connector
execution_mode: argo
icon_url: ""
visibility: public
argo_package_names:
  - "@atlan/mysql"

version: "1.0.0"
build_tag: v1
# If set to true, images will be pushed to a shared repository where customers can also pull
self_deployed_runtime: true

deploy:
  replicaCount: 1
  containerPort: 8000
  env: {}
  dapr:
    secretstore: true
    objectstore: false
    statestore: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
