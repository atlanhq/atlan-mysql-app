name: mysql
app_id: 019c4c4b-8468-7e42-b0d6-eada59da2da1  # Global Marketplace UUID
display_name: "Mysql"
type: connector
execution_mode: argo
icon_url: ""
visibility: public
argo_package_names:
  - "@atlan/mysql"

build_tag: v1
# If set to true, images will be pushed to a shared repository where customers can also pull
self_deployed_runtime: true

deploy:
  replicaCount: 1
  containerPort: 8000

  env:
    ATLAN_HEARTBEAT_TIMEOUT_SECONDS: "7200"
    ATLAN_START_TO_CLOSE_TIMEOUT_SECONDS: "7200"
    ATLAN_TENANT_ID: "default"

  dapr:
    objectstore: true
    secretstore: true
    statestore: false
    eventstore: false
    subscription: false
    configurationstore: false
    lock: false

  # ============================================================================
  # RESOURCES
  # ============================================================================
  # Set CPU and memory limits for your app.
  # Uncomment and adjust based on your app's resource requirements.
  # requests: Minimum guaranteed resources
  # limits: Maximum resources the container can use
  resources:
    requests:
      cpu: 100m           # 0.1 CPU cores
      memory: 1000Mi       # 500 MB RAM
    limits:
      cpu: 1              # 1 CPU core
      memory: 3000Mi      # 1 GB RAM
