# General settings
enabled: true
fullnameOverride: ""
nameOverride: ""
# deployment name can be modified to identify where the app is being deployed
# the final agent name visible in atlan will be the combination of the app name (which is fixed) and the deployment name
deploymentName: "agent" # modify deploymentName as needed

# Global Configuration - Define once, use everywhere
global:
  # Base URLs
  atlanBaseUrl: "{{tenant}}.atlan.com"
  
  # Authentication
  clientId: ""
  clientSecret: ""


# DO NOT MODIFY name as it identifies what application is being deployed
name: "mysql"

# Deployment settings
replicaCount: 1
image:
  repository: atlanhq/atlan-mysql-app
  tag: main-97b8c95
  pullPolicy: Always
containerPort: 8000

#use this if secrets to registry
# imagePullSecrets:
#   - name: registry-secret

nodeSelector: {}

tolerations: []

affinity: {}

priorityClassName: ""

# Annotations for pod
podAnnotations: {}
# Labels for pod
podLabels: {}

# Security context for the deployment
securityContext:
  runAsNonRoot: true
  runAsUser: 1000

# Security context for the pod
podSecurityContext: {}

# Additional volume mounts for the main container
extraVolumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: app-local
    mountPath: /app/local
  # - name: my-volume
  #   mountPath: /path/to/mount

# Additional volumes for the pod
extraVolumes:
  - name: tmp
    emptyDir: {}
  - name: app-local
    emptyDir: {}
  # - name: my-volume
  #   emptyDir: {}
  # - name: config-volume
  #   configMap:
  #     name: my-configmap

daprMetrics:
  enabled: false
  port: 3100

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # - type: External
    #   external:
    #     metric:
    #       name: custom-metric
    #     target:
    #       type: AverageValue
    #       averageValue: 200m

#Environment variables
env: []
  # For env injected secrets, uncomment below
  # - name: ATLAN_AUTH_CLIENT_ID
  #   value: "vault#/secret/data/atlan/auth/client_id"
  # - name: ATLAN_AUTH_CLIENT_SECRET
  #   value: "vault#/secret/data/atlan/auth/client_secret"

# Custom certificates support
# Mount custom certificates for SSL/TLS connections
certificates:
  enabled: false
  # ConfigMap name containing certificates (certificates should be stored as individual files)
  # The ConfigMap should contain certificate files (e.g., ca.crt, custom.crt, etc.)
  configMapName: ""
  # Mount path for certificates directory (default: /etc/ssl/certs/custom)
  mountPath: "/etc/ssl/certs/custom"
  # SSL_CERT_DIR environment variable will be set to this path


# Resources
resources:
  limits:
    cpu: "1000m"
    memory: "2000Mi"
  requests:
    cpu: "250m"
    memory: "512Mi"

# Service Account settings
serviceAccount:
  create: true
  annotations: {}
  # name: ""

# RBAC settings
# Set rbac.create: true to grant the service account read access to Kubernetes secrets
# in the same namespace. Opt-in, disabled by default.
rbac:
  create: false
  rules:
    - apiGroups: [""]
      resources: ["secrets"]
      verbs: ["get", "list", "watch"]


# Liveness and Readiness Probes
readinessProbe:
  enabled: true
  path: "/server/ready"
  initialDelaySeconds: 60
  periodSeconds: 60

livenessProbe:
  enabled: true
  path: "/server/health"
  initialDelaySeconds: 60
  periodSeconds: 60

# Service settings
service:
  type: ClusterIP
  serviceProtocol: TCP

# -- Array of extra K8s manifests to deploy
extraObjects: []

dapr:
  components:
    atlan_objectstore:
      enabled: true
    objectstore:
      enabled: true
      # Namespace of Application.
      # https://docs.dapr.io/reference/components-reference/supported-bindings/
      spec:
        type: bindings.aws.s3
        version: v1
        metadata:
        - name: accessKey
          value: ""
        - name: secretKey
          value: ""
        - name: bucket
          value: ""
        - name: region
          value: ""
        - name: forcePathStyle
          value: ""
    secretstore:
      enabled: true
      # Namespace of Application.
      # https://docs.dapr.io/reference/components-reference/supported-secret-stores/
      spec:
        type: secretstores.aws.secretmanager
        version: v1
        metadata:
        - name: region
          value: ${ATLAN_AWS_REGION}
        # Needed if IAM authentication is not used
        # - name: accessKey
        #   value: ${ATLAN_AWS_ACCESS_KEY_ID}
        # - name: secretKey
        #   value: ${ATLAN_AWS_SECRET_ACCESS_KEY}
          # Needed if IAM authentication is not used
        - name: accessKey
          value: ""
        - name: secretKey
          value: ""

    deployment_secrets:
      enabled: true
      # only used if secretstore is multi key like aws secret manager and need the path to the secret
      multiKeySecretPath: ""
      # Namespace of Application.
      # https://docs.dapr.io/reference/components-reference/supported-secret-stores/
      spec:
        type: secretstores.local.env
        version: v1

    eventstore:
      enabled: true
