schema_type: dataframe
version: 0.22.1
columns:
  table_catalog:
    title: Table Catalog Name Check
    description: Check if the catalog name of records in the raw data is matched as expected
    dtype: str
    nullable: false
    checks:
      str_matches:
        value: mysql_assets_100k
        options:
          raise_warning: false
          ignore_na: true
    unique: false
    coerce: false
    required: true
    regex: false
  table_schema:
    title: Table Schema Name Check
    description: Check if the schema name of records in the raw data is matched as expected
    dtype: str
    nullable: false
    checks:
      str_matches:
        value: mysql_assets_100k
        options:
          raise_warning: false
          ignore_na: true
    unique: false
    coerce: false
    required: true
    regex: false
  table_name:
    title: Table Name Check
    description: Check if table name is present
    dtype: str
    nullable: false
    unique: false
    coerce: false
    required: true
    regex: false
  table_type:
    title: Table Type Check
    description: Check if table type is present (BASE TABLE or VIEW)
    dtype: str
    nullable: false
    unique: false
    coerce: false
    required: true
    regex: false
# Since we are checking the catalog and schema name above, here we are checking if the no. of tables extracted matches the expected count
# We are not checking the table names here since tests will start failing if any adds/removes a table from the database/schema
checks:
  check_record_count_ge:
    value: 10
    options:
      raise_warning: false
      ignore_na: true
index: null
dtype: null
coerce: false
strict: false
name: null
ordered: false
unique: null
report_duplicates: all
unique_column_names: false
add_missing_columns: false
title: Raw MySQL Table Pandera Schema
description: Pandera schema definition for the raw MySQL table output