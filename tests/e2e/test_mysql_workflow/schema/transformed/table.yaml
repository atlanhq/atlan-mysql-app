schema_type: dataframe
version: 0.22.1
columns:
  typeName:
    title: Type Name
    description: Check the type name of the data asset
    dtype: str
    nullable: false
    checks:
      str_matches:
        value: Table
        options:
          raise_warning: false
          ignore_na: true
    unique: false
    coerce: false
    required: true
    regex: false
  attributes.name:
    title: Table Name
    description: The name of the table
    dtype: str
    nullable: false
    unique: false
    coerce: false
    required: true
    regex: false
  attributes.tenantId:
    title: Tenant ID
    description: The ID of the tenant
    dtype: str
    nullable: false
    checks:
      str_matches:
        value: default
        options:
          raise_warning: false
          ignore_na: true
    unique: false
    coerce: false
    required: true
    regex: false
  attributes.connectorName:
    title: Connector Name
    description: Checks the name of the connector.
    dtype: str
    nullable: false
    checks:
      str_matches:
        value: mysql
        options:
          raise_warning: false
          ignore_na: true
    unique: false
    coerce: false
    required: true
    regex: false
  attributes.connectionName:
    title: Connection Name
    description: The name of the connection
    dtype: str
    nullable: false
    checks:
      str_matches:
        value: dev
        options:
          raise_warning: false
          ignore_na: true
    unique: false
    coerce: false
    required: true
    regex: false
  attributes.connectionQualifiedName:
    title: Connection Qualified Name
    description: The qualified name of the connection (structure validation only)
    dtype: str
    nullable: false
    unique: false
    coerce: false
    required: true
    regex: false
  attributes.databaseName:
    title: Database Name
    description: The name of the database (structure validation only)
    dtype: str
    nullable: false
    unique: false
    coerce: false
    required: true
    regex: false
  attributes.databaseQualifiedName:
    title: Database Qualified Name
    description: The qualified name of the database (structure validation only)
    dtype: str
    nullable: false
    unique: false
    coerce: false
    required: true
    regex: false
  attributes.schemaName:
    title: Schema Name
    description: The name of the schema (structure validation only)
    dtype: str
    nullable: false
    unique: false
    coerce: false
    required: true
    regex: false
  attributes.schemaQualifiedName:
    title: Schema Qualified Name
    description: The qualified name of the schema (structure validation only)
    dtype: str
    nullable: false
    unique: false
    coerce: false
    required: true
    regex: false
  attributes.columnCount:
    title: Column Count
    description: The count of columns
    dtype: int64
    nullable: false
    checks:
      greater_than_or_equal_to:
        value: 1
        options:
          raise_warning: false
          ignore_na: true
    unique: false
    coerce: false
    required: true
    regex: false
  status:
    title: Status
    description: The status of the table
    dtype: str
    nullable: false
    checks:
      str_matches:
        value: ACTIVE
        options:
          raise_warning: false
          ignore_na: true
    unique: false
    coerce: false
    required: true
    regex: false
checks:
  check_record_count_ge:
    value: 10
    options:
      raise_warning: false
      ignore_na: true
index: null
dtype: null
coerce: false
strict: false
name: null
ordered: false
unique: null
report_duplicates: all
unique_column_names: false
add_missing_columns: false
title: Transformed MySQL Table Pandera Schema
description: Pandera schema definition for the transformed MySQL table output