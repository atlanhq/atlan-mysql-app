test_workflow_args:
  credentials:
    username: $E2E_MYSQL_USERNAME
    password: $E2E_MYSQL_PASSWORD
    host: $E2E_MYSQL_HOST
    port: $E2E_MYSQL_PORT
    extra: {}
    authType: "basic"
    type: "all"
  metadata:
    exclude-filter: '{}'
    include-filter: '{}'
    temp-table-regex: ""
    extraction-method: "direct"
  connection:
    connection_name: "dev"
    connection_qualified_name: "default/mysql/1738930739"
test_name: "test_mysql_workflow"
server_config:
  server_host: "http://localhost:8000"
  server_version: "workflows/v1"
expected_api_responses:
  auth:
    success: true
    message: "Authentication successful"
  metadata:
    success: true
    # Note: TABLE_CATALOG is always 'def' in MySQL (matches legacy behavior)
    # TABLE_SCHEMA will be the actual schema names from the database
    data: [{'TABLE_CATALOG': 'def', 'TABLE_SCHEMA': 'test_schema'}]
  preflight_check:
    success: true
    data: {'databaseSchemaCheck': {'success': True, 'successMessage': 'Schemas and Databases check successful', 'failureMessage': ''}, 'tablesCheck': {'success': True, 'successMessage': 'Tables check successful. Table count: 100', 'failureMessage': ''}, 'versionCheck': {'success': True, 'successMessage': 'Client version 8.0 meets minimum required version $ATLAN_SQL_SERVER_MIN_VERSION', 'failureMessage': ''}}