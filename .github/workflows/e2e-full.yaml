name: e2e-full

# Full-DAG end-to-end test — runs the connector's code (this PR's
# image) all the way through the tenant's system-apps DAG: extract
# → qi → publish → lineage-app → lineage-publish. Asserts the
# resulting Connection asset lands in Atlas with descendant assets
# (Database / Schema / Table / View / Column) and lineage Process
# rows.
#
# Manual-trigger only — runs are expensive (~10 min compose + 5-15 min
# AE DAG + ~5 min Atlas poll) and create real Connection assets in Atlas
# that don't get cleaned up by this workflow. Trigger before merging a
# meaningful connector change to validate the integration contract with
# the tenant's system apps; per-PR signal comes from the standard SDR
# integration suite (sdr-integration-tests.yaml).
#
# S3 access flows through the tenant's /api/blobstorage proxy via an
# OAuth client (provisioned once per tenant via POST /api/service/
# oauth-clients with the events-app- + temporal-app-permissions-scope
# scopes — see BLDX-1254). The Dapr S3 binding SigV4-signs requests
# using the OAuth client_id as accessKey and client_secret as secretKey;
# the tenant proxy validates and forwards to the actual S3 bucket. No
# STS tokens, no 12h refresh, no GH OIDC trust to set up.
#
# The pair lives as GH secrets SDR_OAUTH_CLIENT_ID /
# SDR_OAUTH_CLIENT_SECRET (set to the same OAuth client_id /
# client_secret the configurator was provisioned with for the
# per-PR integration suite — named distinctly here to make the
# OAuth-via-S3-proxy purpose explicit at the workflow level).
# They're propagated into the worker container's env via the
# e2e-full-docker-compose overlay.

on:
  workflow_dispatch:
    inputs:
      agent_name_override:
        description: Override agent-name (default ci-<run_id>; useful when re-running against a worker that's already up).
        required: false
        type: string
        default: ""

jobs:
  e2e-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: e2e-full-${{ github.ref }}
      cancel-in-progress: false  # don't kill an in-flight tenant workflow
    permissions:
      pull-requests: write
      contents: read
      statuses: write
      packages: write
    env:
      # Tenant + OAuth — same secrets the per-PR SDR integration suite
      # uses (already provisioned on this repo per BLDX-1254). CI_* are
      # read by the configurator to wire app-side auth; ATLAN_AUTH_*
      # are read by the Dapr S3 binding in e2e-full-components/
      # objectstore.yaml for tenant S3 uploads via /api/blobstorage.
      CI_TENANT_DOMAIN: ${{ secrets.SDR_TEST_TENANT }}
      CI_CLIENT_ID: ${{ secrets.SDR_CLIENT_ID }}
      CI_CLIENT_SECRET: ${{ secrets.SDR_CLIENT_SECRET }}
      ATLAN_AUTH_CLIENT_ID: ${{ secrets.SDR_OAUTH_CLIENT_ID }}
      ATLAN_AUTH_CLIENT_SECRET: ${{ secrets.SDR_OAUTH_CLIENT_SECRET }}
      # SDR_OAUTH_* are also picked up by the harness itself
      # (AEWorkflowClient + BaseFullDAGE2ETest): the OAuth pair is
      # exchanged for a 15-min bearer at test-setup time and used for
      # every AE / Atlas / search call. No ATLAN_API_KEY required.
      SDR_OAUTH_CLIENT_ID: ${{ secrets.SDR_OAUTH_CLIENT_ID }}
      SDR_OAUTH_CLIENT_SECRET: ${{ secrets.SDR_OAUTH_CLIENT_SECRET }}
      ATLAN_BASE_URL: ${{ secrets.ATLAN_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve agent-name
        id: agent
        run: |
          if [ -n "${{ inputs.agent_name_override }}" ]; then
            echo "name=${{ inputs.agent_name_override }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=ci-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Using agent-name=$(grep '^name=' "$GITHUB_OUTPUT" | cut -d= -f2)"

      # Same composite action as the per-PR SDR integration suite —
      # different inputs steer it to the full-DAG stack:
      #   - test-path:  tests/full_dag/ (the BaseFullDAGE2ETest suite)
      #   - components-dir: .github/e2e/e2e-full-components (OAuth-proxy
      #     S3 binding pointing at /api/blobstorage)
      #   - compose-overlay: .github/e2e/e2e-full-docker-compose.yaml
      #     (sibling mysql + ATLAN_AUTH_* env + unique deployment_name)
      #   - secrets-script: e2e-full bundle (SDR_MYSQL_USERNAME keys)
      #
      # TODO: switch back to @main once aryaman/bldx-1254-sdr-cross-repo-trigger
      # merges. Branch-pin required because components-dir +
      # compose-overlay inputs only exist on that PR.
      - uses: atlanhq/application-sdk/.github/actions/sdr-e2e@aryaman/bldx-1254-sdr-cross-repo-trigger
        with:
          app-name: mysql
          app-image-name: atlan-mysql-app
          test-path: tests/full_dag/
          secrets-script: .github/e2e/make-secrets-e2e-full.py
          components-dir: .github/e2e/e2e-full-components
          compose-overlay: .github/e2e/e2e-full-docker-compose.yaml
          # Bump the container-health wait because the worker has to
          # establish the Temporal connection with TLS + auth before
          # /server/health turns green.
          container-health-timeout-seconds: "120"
          # Run pytest with -s to see the harness's poll-loop output
          # streamed in real time (the SDR action's default pytest
          # buffering hides it).
          pytest-extra-args: "-s"
