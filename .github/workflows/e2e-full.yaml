name: e2e-full

# Full-DAG end-to-end test for the MySQL connector. Delegates to the
# SDK's reusable e2e-full workflow — all the env wiring, timeout
# tuning, container-health bump, and SDR composite-action invocation
# lives in one place there. Per-app overrides go on the `with:` block.
#
# Triggers:
#   - workflow_dispatch (manual; supports an `application_sdk_ref`
#     input so apps-sdk PRs can re-run this via cross-repo dispatch)
#   - pull_request labeled with `e2e-full` (per-PR opt-in;
#     re-triggers on subsequent pushes once the label is set).
#
# Required GH repo secrets (inherited via `secrets: inherit`):
#   SDR_TEST_TENANT, SDR_CLIENT_ID, SDR_CLIENT_SECRET — configurator
#   ATLAN_BASE_URL, ATLAN_API_KEY — AE management + harness bearer
#   SDR_OAUTH_CLIENT_ID, SDR_OAUTH_CLIENT_SECRET — Dapr S3 (OAuth
#     proxy) + pyatlan asset queries

on:
  workflow_dispatch:
    inputs:
      agent_name_override:
        description: Override agent-name (default ci-<run_id>; useful when re-running against a worker that's already up).
        required: false
        type: string
        default: ""
      application_sdk_ref:
        description: |
          (Cross-repo dispatch from apps-sdk PRs.) Branch / tag / SHA
          of atlanhq/application-sdk to re-pin before the run. Empty
          means "use the repo's pyproject pin".
        required: false
        type: string
        default: ""
      distinct_id:
        description: |
          Identifier used by codex-/return-dispatch on the apps-sdk
          side to locate this run from the calling workflow. Echoed
          in the "distinct-id" step name; never read by test code.
        required: false
        type: string
        default: ""
  pull_request:
    types: [labeled, synchronize]

jobs:
  e2e-full:
    name: E2E Full with system apps (${{ github.head_ref || github.ref_name }})
    # Run only when (a) manually dispatched, or (b) the PR carries the
    # `e2e-test-full` label (whether it was just applied or applied
    # earlier and someone pushed). Skips on PRs from forks and on
    # bot-authored PRs — full-DAG runs touch real tenant assets so we
    # don't want them firing on untrusted inputs.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        (
          (github.event.action == 'labeled' && github.event.label.name == 'e2e-full') ||
          contains(github.event.pull_request.labels.*.name, 'e2e-full')
        ) &&
        github.event.pull_request.head.repo.fork != true &&
        github.event.pull_request.user.login != 'dependabot[bot]'
      )
    # TODO: switch to @main once the reusable workflow lands on the
    # SDK default branch. Branch-pin while internal-ref is still on the
    # feature branch.
    uses: atlanhq/application-sdk/.github/workflows/e2e-full-reusable.yaml@internal-ref-sdr-cross-repo-trigger
    with:
      app-name: mysql
      app-image-name: atlan-mysql-app
      agent-name-override: ${{ inputs.agent_name_override }}
      application-sdk-ref: ${{ inputs.application_sdk_ref }}
      distinct-id: ${{ inputs.distinct_id }}
    secrets: inherit
