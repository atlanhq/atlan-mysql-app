name: e2e-full

# Full-DAG end-to-end test for the MySQL connector. Delegates to the
# SDK's reusable e2e-full workflow — all the env wiring, timeout
# tuning, container-health bump, and SDR composite-action invocation
# lives in one place there. Per-app overrides go on the `with:` block.
#
# Manual-trigger only — runs are ~20 min on a quiet tenant and create
# real Connection assets in Atlas that don't get cleaned up by this
# workflow. Trigger before merging a meaningful connector change to
# validate the integration contract with the tenant's system apps;
# per-PR signal comes from the standard SDR integration suite
# (sdr-integration-tests.yaml).
#
# Required GH repo secrets (inherited via `secrets: inherit`):
#   SDR_TEST_TENANT, SDR_CLIENT_ID, SDR_CLIENT_SECRET — configurator
#   ATLAN_BASE_URL, ATLAN_API_KEY — AE management + harness bearer
#   SDR_OAUTH_CLIENT_ID, SDR_OAUTH_CLIENT_SECRET — Dapr S3 (OAuth
#     proxy) + pyatlan asset queries

on:
  workflow_dispatch:
    inputs:
      agent_name_override:
        description: Override agent-name (default ci-<run_id>; useful when re-running against a worker that's already up).
        required: false
        type: string
        default: ""

jobs:
  e2e-full:
    # TODO: switch to @main once the reusable workflow lands on the
    # SDK default branch. Branch-pin while BLDX-1254 is still on the
    # feature branch.
    uses: atlanhq/application-sdk/.github/workflows/e2e-full-reusable.yaml@aryaman/bldx-1254-sdr-cross-repo-trigger
    with:
      app-name: mysql
      app-image-name: atlan-mysql-app
      agent-name-override: ${{ inputs.agent_name_override }}
    secrets: inherit
