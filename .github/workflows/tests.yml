name: Tests

# Unified workflow — pre-commit + unit + e2e all gated through
# `tests-passed`. Templated from atlan-mssql-app/.github/workflows/tests.yaml
# with the pre-commit job folded in from this repo's prior tests.yml.
#
# The certification gate at .github/workflows/build-and-publish.yaml:51
# (`unit_tests_workflow_file: "tests.yml"`) waits on this workflow's
# overall conclusion before publishing. Keep the filename `tests.yml` to
# preserve that wiring.
#
# SDR runs in its own workflow (sdr-integration-tests.yaml) because it
# supports cross-repo dispatch from application-sdk — folding it in here
# would lose that capability.
#
# Trigger: every commit (push to main + PR open/synchronize/reopened).

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
  workflow_dispatch:    # required by the unit-tests-gate (see SDK docs)

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── Pre-commit: ruff, formatting, type checking ─────────────────────
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: tests-pre-commit-${{ github.ref }}
      cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  # ── Unit + e2e tests in a single parallel pytest invocation ─────────
  unit-e2e:
    name: unit + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: tests-unit-e2e-${{ github.ref }}
      cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
    permissions:
      pull-requests: write
      contents: read
    outputs:
      summary: ${{ steps.tests.outputs.summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Dapr + Temporal + setup-deps + setup-local-creds + native app on :8000.
      # After this step, the connector is serving and we can run pytest.
      - name: Bring up MySQL test stack
        uses: ./.github/actions/mysql-test-stack

      # Single pytest invocation covering unit + e2e in parallel.
      # `--dist=loadfile` groups tests by file so each test class's
      # setup_class runs once (in the worker that owns its file), keeping
      # xdist-with-stateful-fixtures predictable.
      #
      # tests/e2e/conftest.py spins up a testcontainers-managed mysql:8.0
      # when MYSQL_HOST is not set — Docker is available on ubuntu-latest.
      - name: Run unit + e2e (parallel via pytest-xdist)
        id: tests
        env:
          # The composite action started the app on :8000; tests hit it
          # via BASE_URL (default http://localhost:8000).
          APP_BASE_URL: http://localhost:8000
          CREDENTIAL_GUID: local-mysql
          DAPR_HTTP_PORT: "3500"
          DAPR_GRPC_PORT: "50001"
          # Keep extract / transform local artefacts on disk after
          # on_complete() so the e2e test can validate raw/<entity>/records.json
          # and transformed/<entity>/entities.json under the request-payload
          # output_path. See atlan-mssql-app/.github/workflows/tests.yaml for
          # the equivalent rationale.
          APPLICATION_SDK_ENABLE_CLEANUP_INTERCEPTOR: "false"
          ATLAN_LOCAL_DEVELOPMENT: "true"
          ATLAN_APPLICATION_NAME: mysql
        run: |
          mkdir -p results
          set +e
          uv run --with pytest-xdist --with pytest-cov pytest tests/unit tests/e2e -v \
            -n auto \
            --dist=loadfile \
            --cov=app \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            --cov-fail-under=0 \
            --tb=short \
            --timeout=600 \
            --junit-xml=results/test-results.xml \
            2>&1 | tee results/test-output.txt
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$TEST_EXIT_CODE" >> "$GITHUB_OUTPUT"
          # Extract the pytest summary line (last `=== ... ===` line) so
          # the aggregator job can quote it in the PR comment.
          SUMMARY=$(grep -E "^=+ .* =+$" results/test-output.txt | tail -1 | sed -E 's/^=+ *//; s/ *=+$//')
          echo "summary=${SUMMARY:-no summary parsed}" >> "$GITHUB_OUTPUT"
          exit "$TEST_EXIT_CODE"

      - name: Capture app log on failure
        if: failure()
        run: |
          echo "## App log tail" >> "$GITHUB_STEP_SUMMARY"
          echo "<pre>" >> "$GITHUB_STEP_SUMMARY"
          tail -200 results/app-server.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          echo "</pre>" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on PR
        if: always() && github.event_name == 'pull_request'
        uses: orgoro/coverage@3f13a558c5af7376496aa4848bf0224aead366ac # v3.2
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload test + coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-e2e-results
          path: |
            results/
            coverage.xml
            htmlcov/
          retention-days: 14

  # Aggregator gate — succeeds only if BOTH child jobs succeeded.
  # Mark this as the single required check in branch protection
  # (Settings → Branches → Branch protection rule for main → Require
  # status checks → add `Tests / tests-passed`).
  tests-passed:
    name: tests-passed
    needs: [pre-commit, unit-e2e]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Post unified test-summary comment on PR
        # Posts BEFORE the verify step so the comment lands even on failure.
        # `message-id: tests-summary` makes mshick/add-pr-comment update the
        # same comment on subsequent runs instead of stacking new ones.
        if: always() && github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2.8.2
        with:
          message-id: tests-summary
          message: |
            ## Tests Summary

            | Job | Status | Result |
            |---|---|---|
            | pre-commit | ${{ needs.pre-commit.result == 'success' && '✅ Passed' || (needs.pre-commit.result == 'skipped' && '⊘ Skipped' || '❌ Failed') }} | — |
            | unit + e2e | ${{ needs.unit-e2e.result == 'success' && '✅ Passed' || (needs.unit-e2e.result == 'skipped' && '⊘ Skipped' || '❌ Failed') }} | `${{ needs.unit-e2e.outputs.summary || 'no summary' }}` |

            **Overall:** ${{ (needs.pre-commit.result == 'success' && needs.unit-e2e.result == 'success') && '✅ All passed' || '❌ Some failed' }} — [view run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
        continue-on-error: true

      - name: Verify all test jobs succeeded
        run: |
          if [ "${{ needs.pre-commit.result }}" != "success" ]; then
            echo "::error::pre-commit job did not succeed (result=${{ needs.pre-commit.result }})"
            exit 1
          fi
          if [ "${{ needs.unit-e2e.result }}" != "success" ]; then
            echo "::error::unit + e2e job did not succeed (result=${{ needs.unit-e2e.result }})"
            exit 1
          fi
          echo "All test jobs passed."
