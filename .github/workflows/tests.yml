name: Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:

  # ── Pre-commit: ruff, formatting, type checking ─────────────────────
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  # ── Unit tests ──────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run unit tests
        run: |
          set -o pipefail
          uv run pytest tests/unit/ -v \
            --durations=10 \
            --durations-min=0.5 \
            --junit-xml=junit-unit.xml \
            --cov=app \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term-missing \
            2>&1 | tee pytest-output.txt

      - name: Test summary
        if: always()
        run: |
          echo "## Unit Test Results" >> $GITHUB_STEP_SUMMARY
          if [ -f pytest-output.txt ]; then
            SUMMARY=$(grep -E "^=+ .* =+$" pytest-output.txt | tail -1 || echo "no result")
            echo "**$SUMMARY**" >> $GITHUB_STEP_SUMMARY
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: junit-unit.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage-unit.xml

  # ── Coverage comment on PR ──────────────────────────────────────────
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: unit-tests
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage-data
        continue-on-error: true

      - uses: MishaKav/pytest-coverage-comment@v1
        if: hashFiles('coverage-data/coverage-unit.xml') != ''
        with:
          pytest-xml-coverage-path: coverage-data/coverage-unit.xml
          title: MySQL Connector — Coverage Report
          badge-title: Coverage
