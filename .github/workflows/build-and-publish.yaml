name: Build & Publish

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!images/**'
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to build and publish (default: current branch)"
        required: false
        type: string
      channel:
        description: "Target channel (ignored when tenants is set)"
        type: string
        default: "all"
      tenants:
        description: "Comma-separated tenant IDs for targeted publish"
        type: string
        default: ""

jobs:
  build-and-publish:
    uses: atlanhq/application-sdk/.github/workflows/build-and-publish-app.yaml@main
    with:
      ref: ${{ inputs.ref || github.ref }}
      publish: true
      channel: ${{ inputs.channel || 'all' }}
      tenants: ${{ inputs.tenants || '' }}
    secrets: inherit
