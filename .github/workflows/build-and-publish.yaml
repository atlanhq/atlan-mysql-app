name: Build & Publish

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!images/**'
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to marketplace after build"
        type: boolean
        default: true
      ref:
        description: "Branch, tag, or SHA to build (default: current branch)"
        required: false
        type: string
      channel:
        description: "Target channel (ignored when tenants is set)"
        type: string
        default: "all"
      tenants:
        description: "Comma-separated tenant IDs for targeted publish"
        type: string
        default: ""

jobs:
  read-version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - id: version
        run: echo "version=$(cat version.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

  build-and-publish:
    needs: read-version
    uses: atlanhq/application-sdk/.github/workflows/build-and-publish-app.yaml@main
    with:
      ref: ${{ inputs.ref || github.ref }}
      publish: ${{ github.event_name == 'push' || github.event.inputs.publish != 'false' }}
      channel: ${{ inputs.channel || 'all' }}
      tenants: ${{ inputs.tenants || '' }}
      release_tag: ${{ needs.read-version.outputs.version }}
    secrets: inherit
