name: Codex Review

# On-demand Codex PR review.
#
# Required repo secret:
#   OPENAI_API_KEY
#
# Usage:
#   Actions -> Codex Review -> Run workflow -> provide PR number

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: number
      persona_mode:
        description: "Reviewer persona preset"
        required: true
        type: choice
        options:
          - atlan-connector
          - security
          - reliability
          - maintainability
        default: atlan-connector
      custom_persona:
        description: "Optional custom persona override"
        required: false
        type: string
      instructions:
        description: "Optional extra review guidance for Codex"
        required: false
        type: string

concurrency:
  group: codex-review-${{ inputs.pr_number }}
  cancel-in-progress: true

env:
  CODEX_MODEL: gpt-5.2-codex

jobs:
  codex-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - name: Load pull request metadata
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = Number('${{ inputs.pr_number }}');
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput('pr_number', String(pr.number));
            core.setOutput('title', pr.title || '');
            core.setOutput('body', pr.body || '');
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('head_sha', pr.head.sha);

      - name: Resolve persona
        id: persona
        shell: bash
        env:
          PERSONA_MODE: ${{ inputs.persona_mode }}
          CUSTOM_PERSONA: ${{ inputs.custom_persona }}
        run: |
          set -euo pipefail
          if [ -n "${CUSTOM_PERSONA}" ]; then
            persona="${CUSTOM_PERSONA}"
          else
            case "${PERSONA_MODE}" in
              atlan-connector)
                persona="Senior Atlan connector reviewer focused on correctness, security, workflow semantics, schema/config drift, and CI reliability."
                ;;
              security)
                persona="Senior application security reviewer focused on secret handling, auth flows, CI/CD hardening, supply chain pinning, and unsafe trust boundaries."
                ;;
              reliability)
                persona="Senior reliability reviewer focused on failure handling, workflow ordering, retries, partial-success bugs, operational regressions, and test validity."
                ;;
              maintainability)
                persona="Senior maintainer focused on long-term code health, contract/generated-artifact consistency, test quality, and change clarity."
                ;;
              *)
                persona="Senior code reviewer focused on correctness and security."
                ;;
            esac
          fi

          {
            echo "value<<EOF"
            echo "${persona}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout PR merge ref
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ inputs.pr_number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Pre-fetch base and head refs
        env:
          PR_BASE_REF: ${{ steps.pr.outputs.base_ref }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "$PR_BASE_REF" \
            "+refs/pull/$PR_NUMBER/head"

      - name: Run Codex review
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ env.CODEX_MODEL }}
          sandbox: read-only
          prompt: |
            Persona:
            ${{ steps.persona.outputs.value }}

            You are acting as a reviewer for a proposed code change made by another engineer.
            Focus on issues that impact correctness, performance, security, maintainability, or developer experience.
            Flag only actionable issues introduced by the pull request.
            When you flag an issue, provide a short, direct explanation and cite the affected file and line.
            Prioritize severe issues and avoid nit-level comments unless they block understanding of the diff.
            If no blocking or meaningful issues are found, say so explicitly.
            Prefer findings over summaries.

            Output format:
            1. Start with `Findings:`
            2. List issues as a numbered list ordered by severity
            3. Each issue must include: severity, impact, file reference
            4. If there are no issues, say `Findings: none`
            5. After findings, add a short `Verdict:` line

            This is PR #${{ steps.pr.outputs.pr_number }} for ${{ github.repository }}.

            Review ONLY the changes introduced by this PR. Use:
              git log --oneline ${{ steps.pr.outputs.base_sha }}...${{ steps.pr.outputs.head_sha }}
              git diff --stat ${{ steps.pr.outputs.base_sha }}...${{ steps.pr.outputs.head_sha }}
              git diff ${{ steps.pr.outputs.base_sha }}...${{ steps.pr.outputs.head_sha }}

            Pull request title:
            ${{ steps.pr.outputs.title }}

            Pull request body:
            ${{ steps.pr.outputs.body }}

            Additional instructions:
            ${{ inputs.instructions }}

  post-feedback:
    runs-on: ubuntu-latest
    needs: codex-review
    if: ${{ needs.codex-review.outputs.final_message != '' }}
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Create or update PR comment
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex-review.outputs.final_message }}
          PR_NUMBER: ${{ needs.codex-review.outputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- codex-review -->';
            const body = `${marker}

            ## Codex Review

            ${process.env.CODEX_FINAL_MESSAGE}`;

            const issue_number = Number(process.env.PR_NUMBER);
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
