name: dep-cooldown

# Calls the org-shared cooldown checker in atlanhq/.github, which enforces the
# 7-day release-age policy on dependency bumps.
#
# Threshold (min-age-days) is controlled centrally by the default in the reusable
# workflow — change it once there to apply org-wide. To override per-repo, add a
# `with: { min-age-days: <n> }` block here.
#
# Bypass: add the 'security' label to the PR (audited). Security fixes take
# priority over the cooldown.
#
# NOTE: this workflow is NOT part of the conformance bootstrap template set, so
# `bootstrap` will never create or update it. It has to be added by hand, which
# is why it was absent here.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  cooldown:
    uses: atlanhq/.github/.github/workflows/reusable-dep-cooldown.yml@main
    # Forwards SLACK_DEP_COOLDOWN_WEBHOOK so cooldown failures alert in
    # #community-security.
    secrets: inherit
