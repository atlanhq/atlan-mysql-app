name: SDR Full-DAG E2E (tier 4)

# Tier-4 test — runs the connector's code (this PR's image) end-to-end
# through the tenant's full system-apps DAG: extract → qi → publish →
# lineage-app → lineage-publish. Asserts the resulting Connection
# asset lands in Atlas.
#
# Manual-trigger only — runs are expensive (~10 min compose + 5-15 min
# AE DAG + ~5 min Atlas poll) and create real Connection assets in Atlas
# that don't get cleaned up by this workflow. Trigger before merging a
# meaningful connector change to validate the integration contract with
# the tenant's system apps; per-PR signal comes from tier-3
# (sdr-integration-tests.yaml).
#
# AWS creds are pasted as workflow_dispatch inputs because:
#   1. The IAM Identity Center role we have access to is SSO-only (no
#      IAM:CreateRole, so we can't set up GH OIDC trust without platform).
#   2. STS session tokens expire in <= 12h, so storing them in GH
#      secrets isn't viable.
#   3. Each run is < 30 min, so a fresh STS bundle pasted at trigger
#      time outlasts the run comfortably.
#
# Get fresh STS creds from the AWS access portal:
#   Customer-Prod India (677185614191) → S3-Development-Bucket-role
#   → "Get credentials" → Option 1 (Set AWS environment variables)

on:
  workflow_dispatch:
    inputs:
      aws_access_key_id:
        description: STS access key id (AWS IAM Identity Center, S3-Development-Bucket-role)
        required: true
        type: string
      aws_secret_access_key:
        description: STS secret access key
        required: true
        type: string
      aws_session_token:
        description: STS session token
        required: true
        type: string
      agent_name_override:
        description: Override agent-name (default ci-<run_id>; useful when re-running against a worker that's already up).
        required: false
        type: string
        default: ""

jobs:
  tier-4-full-dag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: tier-4-full-dag-${{ github.ref }}
      cancel-in-progress: false  # don't kill an in-flight tenant workflow
    permissions:
      pull-requests: write
      contents: read
      statuses: write
      packages: write
    env:
      # Tenant + OAuth — same secrets tier-3 uses (already provisioned
      # on this repo per internal-ref).
      CI_TENANT_DOMAIN: ${{ secrets.SDR_TEST_TENANT }}
      CI_CLIENT_ID: ${{ secrets.SDR_CLIENT_ID }}
      CI_CLIENT_SECRET: ${{ secrets.SDR_CLIENT_SECRET }}
      # AE submit + native-status poll + Atlas Connection probe all
      # use ATLAN_API_KEY (which is what the harness reads).
      ATLAN_BASE_URL: ${{ secrets.ATLAN_BASE_URL }}
      ATLAN_API_KEY: ${{ secrets.ATLAN_API_KEY }}
      # AWS STS creds — read by the Dapr S3 binding in the
      # tier-4-components/objectstore.yaml + eventstore.yaml.
      # Mask explicitly because GH Actions doesn't auto-mask
      # workflow_dispatch input values the way it does secrets.
      AWS_ACCESS_KEY_ID: ${{ inputs.aws_access_key_id }}
      AWS_SECRET_ACCESS_KEY: ${{ inputs.aws_secret_access_key }}
      AWS_SESSION_TOKEN: ${{ inputs.aws_session_token }}
    steps:
      - name: Mask STS credentials
        run: |
          echo "::add-mask::${{ inputs.aws_access_key_id }}"
          echo "::add-mask::${{ inputs.aws_secret_access_key }}"
          echo "::add-mask::${{ inputs.aws_session_token }}"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve agent-name
        id: agent
        run: |
          if [ -n "${{ inputs.agent_name_override }}" ]; then
            echo "name=${{ inputs.agent_name_override }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=ci-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Using agent-name=$(grep '^name=' "$GITHUB_OUTPUT" | cut -d= -f2)"

      # Same composite action as tier-3 — different inputs steer it to
      # the tier-4 stack:
      #   - test-path:  tests/full_dag/ (the BaseFullDAGE2ETest suite)
      #   - components-dir: .github/e2e/tier-4-components (S3 binding)
      #   - compose-overlay: .github/e2e/tier-4-docker-compose.yaml
      #     (sibling mysql + AWS env + unique deployment_name)
      #   - secrets-script: tier-4 bundle (SDR_MYSQL_USERNAME keys)
      #
      # TODO: switch back to @main once internal-ref-sdr-cross-repo-trigger
      # merges. Branch-pin required because components-dir +
      # compose-overlay inputs only exist on that PR.
      - uses: atlanhq/application-sdk/.github/actions/sdr-e2e@internal-ref-sdr-cross-repo-trigger
        with:
          app-name: mysql
          app-image-name: atlan-mysql-app
          test-path: tests/full_dag/
          secrets-script: .github/e2e/make-secrets-tier-4.py
          components-dir: .github/e2e/tier-4-components
          compose-overlay: .github/e2e/tier-4-docker-compose.yaml
          # Bump the container-health wait because the worker has to
          # establish the Temporal connection with TLS + auth before
          # /server/health turns green.
          container-health-timeout-seconds: "120"
          # Run pytest with -s to see the harness's poll-loop output
          # streamed in real time (default tier-3 buffering hides it).
          pytest-extra-args: "-s"
