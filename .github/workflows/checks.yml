name: Pre-commit Checks
# Thin caller. All of the body — checkout, the optional system-deps step,
# setup-deps and pre-commit itself — lives in the reusable, so the third-party
# action pins it needs are maintained in application-sdk rather than in this
# repo's copy (FND-1994). This file is responsible only for the trigger, the
# permissions grant, the concurrency group, and whichever apt packages this
# repo needs installed before `uv sync`.
#
# `permissions:` is exhaustive, not additive: every scope it omits is `none`.
# `contents: read` is what lets the reusable's `actions/checkout` read this repo.

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  merge_group:
  # A `/gate-check` comment on a bump-version PR dispatches this (FND-3839).
  workflow_dispatch:

jobs:
  pre-commit:
    # Bump-version PR CI is opt-in (FND-3748): its pull_request run skips here,
    # and a `/gate-check` comment dispatches this workflow on the bump branch
    # instead (head_ref is empty on a dispatch, so it runs). Skipping this
    # CALLER job costs no runner and never creates its required context, so a
    # fresh bump commit sits at "Expected" — Release Gate says why — rather
    # than reading a skipped check as a pass. No `labeled` trigger: a label
    # add on the same commit started a second run that evicted the first
    # (FND-3839).
    if: >-
      !startsWith(github.head_ref, 'bump-version')
    uses: atlanhq/application-sdk/.github/workflows/checks-reusable.yaml@main
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
