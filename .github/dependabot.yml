version: 2
updates:
  # Python deps are managed via uv sync --upgrade / uv.lock, not Dependabot.

  # GitHub Actions — grouped into one PR
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
