# e2e-full compose overlay (paired with .github/workflows/tests.yaml
# and tests/e2e/). Sits on top of the configurator-generated base
# + SDK CI defaults; replaces the per-PR SDR integration overlay
# (localstorage + hermetic seed) with:
#
#   1. Sibling mysql:8.0 with the SAME .github/e2e/seed.sql so the
#      hermetic dataset is reused for deterministic asset counts.
#   2. ATLAN_DEPLOYMENT_NAME=e2e-full-ci-<run_id> so the worker
#      registers on Temporal queue atlan-mysql-e2e-full-ci-<run_id>.
#      The test class' agent_spec() produces a matching agent_name
#      = mysql-e2e-full-ci-<run_id>, so AE dispatches extract
#      activities to the same queue this worker listens on. Every
#      CI run has a clearly-labeled unique queue + workflow lineage
#      for grep-driven traceability across systems.
#
# The UPSTREAM atlan-objectstore (Atlan blobstorage proxy) + ATLAN_AUTH_
# CLIENT_ID/SECRET are handled by the configurator + SDK's docker-compose.ci.yml
# base layer (SDR_CLIENT_ID/SECRET → ATLAN_AUTH_CLIENT_ID/SECRET).
#
# DISTR-762 (AWS/S3 matrix leg): the CUSTOMER object store is overridden to a
# real S3 store via the LocalStack sidecar below + e2e-full-components/
# objectstore.yaml. atlan-app waits on localstack being healthy (= bucket
# created) so the worker's S3 staging path is exercised end-to-end.

services:
  localstack:
    image: localstack/localstack:3
    environment:
      - SERVICES=s3
      - DEBUG=0
    volumes:
      # Ready-hook: create the customer bucket once S3 is up.
      - ${GITHUB_WORKSPACE}/.github/e2e/localstack-init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    healthcheck:
      # Green only after the ready-hook created the bucket → gates atlan-app.
      test: ["CMD", "bash", "-c", "awslocal s3api head-bucket --bucket atlan-customer-e2e"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    expose:
      - "4566"

  mysql:
    image: mysql:8.0.40
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: root_e2e_pass
      MYSQL_DATABASE: e2e_main
      MYSQL_USER: e2e_user
      MYSQL_PASSWORD: e2e_pass
    volumes:
      - ${GITHUB_WORKSPACE}/.github/e2e/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    expose:
      - "3306"

  atlan-app:
    depends_on:
      mysql:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      # Unique per-run deployment name embedding the test identifier.
      # The SDK derives the Temporal task queue as
      #   queue = atlan-{connector}-{deployment_name}
      #         = atlan-mysql-e2e-full-ci-<run_id>
      # which matches what the AE workflow's agent_json + Argo template
      # build for routing. Nobody else picks up from this queue.
      - ATLAN_DEPLOYMENT_NAME=e2e-full-ci-${GITHUB_RUN_ID}
