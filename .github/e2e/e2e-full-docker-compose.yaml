# e2e-full compose overlay (paired with .github/workflows/tests.yaml
# and tests/e2e/). Sits on top of the configurator-generated base
# + SDK CI defaults; replaces the per-PR SDR integration overlay
# (localstorage + hermetic seed) with:
#
#   1. Sibling mysql:8.0 with the SAME .github/e2e/seed.sql so the
#      hermetic dataset is reused for deterministic asset counts.
#   2. ATLAN_DEPLOYMENT_NAME inherited from the sdr-e2e action's
#      per-leg derivation (e2e-full-ci-<run_id>[-<leg>]) so the worker
#      registers on Temporal queue atlan-mysql-<deployment_name>.
#      The test class' agent_spec() reads the SAME env, so AE dispatches
#      extract activities to the exact queue this worker listens on.
#      Every CI run has a clearly-labeled unique queue + workflow lineage
#      for grep-driven traceability across systems.
#
# The S3/blobstorage objectstore component and ATLAN_AUTH_CLIENT_ID/
# SECRET are handled by the configurator + SDK's docker-compose.ci.yml
# base layer (SDR_CLIENT_ID/SECRET → ATLAN_AUTH_CLIENT_ID/SECRET) —
# no explicit override needed here.

services:
  mysql:
    image: mysql:8.0.40
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: root_e2e_pass
      MYSQL_DATABASE: e2e_main
      MYSQL_USER: e2e_user
      MYSQL_PASSWORD: e2e_pass
    volumes:
      - ${GITHUB_WORKSPACE}/.github/e2e/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    expose:
      - "3306"

  atlan-app:
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Unique per-run deployment name embedding the test identifier.
      # The SDK derives the Temporal task queue as
      #   queue = atlan-{connector}-{deployment_name}
      # which matches what the AE workflow's agent_json + Argo template
      # build for routing. Nobody else picks up from this queue.
      #
      # INHERIT the value sdr-e2e's `derive_deployment_name.py` writes to
      # $GITHUB_ENV — it appends the matrix leg name (the suite slug), e.g.
      #   e2e-full-ci-<run_id>-mysql-full-dag
      # for per-leg queue isolation. The harness reads the SAME env in
      # BaseE2ETest.agent_spec(), so worker + harness stay in lock-step.
      # Hard-coding e2e-full-ci-<run_id> here (dropping the leg suffix)
      # made the worker poll atlan-mysql-e2e-full-ci-<run_id> while the
      # harness dispatched to atlan-mysql-e2e-full-ci-<run_id>-<leg> —
      # "No Workers Running" until the run timed out. Fall back to the
      # bare shape for local `docker compose` runs where the CI action
      # hasn't exported the derived name.
      - ATLAN_DEPLOYMENT_NAME=${ATLAN_DEPLOYMENT_NAME:-e2e-full-ci-${GITHUB_RUN_ID}}
