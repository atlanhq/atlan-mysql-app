apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: objectstore
spec:
  type: bindings.aws.s3
  version: v1
  # Tier-4 writes extract+transform output to the tenant's shared S3
  # bucket so the in-cluster publish/qi/lineage system apps can read
  # the same prefix. AWS creds come from the worker container's env
  # (set by the tier-4 docker-compose overlay from the workflow_dispatch
  # STS inputs).
  #
  # Bucket name + region must match what the tenant's publish app is
  # configured to read from on devex (see the in-cluster mysql-server
  # pod's atlan-objectstore component). Hard-coding here so the
  # workflow doesn't have to plumb them through.
  ignoreErrors: false
  metadata:
    - name: bucket
      value: atlan-vcluster-atlanimp01-793436jsim4q
    - name: region
      value: ap-south-1
    - name: forcePathStyle
      value: "true"
    - name: accessKey
      secretKeyRef:
        name: AWS_ACCESS_KEY_ID
    - name: secretKey
      secretKeyRef:
        name: AWS_SECRET_ACCESS_KEY
    - name: sessionToken
      secretKeyRef:
        name: AWS_SESSION_TOKEN
auth:
  # The Dapr local.env secret store ships with the runtime; it reads
  # values straight from the container's environment. Wiring it here
  # keeps the AWS creds out of the component YAML on disk (which gets
  # printed in `docker compose config` and uploaded as artifact).
  secretStore: deployment-secret-store
