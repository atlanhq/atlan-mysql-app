apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: objectstore
spec:
  # Mirrors the production-deployed atlan-mysql-app component shape
  # (components/atlan-storage.yaml): writes go to the tenant's S3 via
  # the /api/blobstorage proxy, which validates SigV4 signed with an
  # OAuth client pair (provisioned once via /api/service/oauth-clients
  # — see BLDX-1254). The tenant proxy translates the logical bucket
  # name to the real underlying S3 bucket so this YAML doesn't have to
  # know it.
  #
  # This shape replaces the original e2e-full override which wired in
  # raw AWS STS keys from workflow_dispatch inputs. OAuth client_id /
  # client_secret are long-lived (provisioned per BLDX-1254 and stored
  # as the SDR_OAUTH_CLIENT_ID / SDR_OAUTH_CLIENT_SECRET GH secrets) —
  # no per-run STS pasting, no 12h expiry to chase.
  type: bindings.aws.s3
  version: v1
  ignoreErrors: false
  metadata:
    - name: bucket
      value: atlan-bucket
    - name: region
      value: us-east-1
    - name: endpoint
      value: https://devex.atlan.com/api/blobstorage
    - name: forcePathStyle
      value: "true"
    - name: accessKey
      secretKeyRef:
        name: ATLAN_AUTH_CLIENT_ID
        key: ATLAN_AUTH_CLIENT_ID
    - name: secretKey
      secretKeyRef:
        name: ATLAN_AUTH_CLIENT_SECRET
        key: ATLAN_AUTH_CLIENT_SECRET
auth:
  secretStore: deployment-secret-store
