apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: objectstore
spec:
  # Overrides the SDK sdr-e2e default (bindings.localstorage) so that the
  # connector worker writes extracted artifacts to the tenant's S3-compatible
  # blobstorage proxy. The publish app reads from the same bucket.
  #
  # Endpoint is read from ATLAN_BLOBSTORAGE_ENDPOINT (set in
  # e2e-full-docker-compose.yaml as ${ATLAN_BASE_URL}/api/blobstorage) so
  # the tenant URL is never hardcoded here.
  # Credentials come from ATLAN_AUTH_CLIENT_ID / ATLAN_AUTH_CLIENT_SECRET,
  # which the SDK's docker-compose.ci.yml bridges from SDR_CLIENT_ID /
  # SDR_CLIENT_SECRET.
  type: bindings.aws.s3
  version: v1
  ignoreErrors: false
  metadata:
    - name: bucket
      value: atlan-bucket
    - name: region
      value: us-east-1
    - name: endpoint
      secretKeyRef:
        name: ATLAN_BLOBSTORAGE_ENDPOINT
        key: ATLAN_BLOBSTORAGE_ENDPOINT
    - name: forcePathStyle
      value: "true"
    - name: accessKey
      secretKeyRef:
        name: ATLAN_AUTH_CLIENT_ID
        key: ATLAN_AUTH_CLIENT_ID
    - name: secretKey
      secretKeyRef:
        name: ATLAN_AUTH_CLIENT_SECRET
        key: ATLAN_AUTH_CLIENT_SECRET
auth:
  secretStore: deployment-secret-store
