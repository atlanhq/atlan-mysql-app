# App-level compose overlay layered on top of:
#   ci-deploy/docker-compose.yaml (atlan-configurator output)
#   $action_path/docker-compose.ci.yml (SDK CI defaults)
#
# Brings up a hermetic mysql:8.0 alongside the connector container so the
# SDR tests don't need an externally-provisioned database. Seeded via
# /docker-entrypoint-initdb.d/seed.sql on first boot.
#
# Credentials are CI-only constants (not real secrets); they match the
# values the secrets-bundle script writes to /app/secrets/credentials.json
# and the host/port/db values pinned in tests/sdr/test_mysql_sdr.py.

services:
  mysql:
    image: mysql:8.0.40
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: root_e2e_pass
      MYSQL_DATABASE: e2e_main
      MYSQL_USER: e2e_user
      MYSQL_PASSWORD: e2e_pass
    volumes:
      - ${GITHUB_WORKSPACE}/.github/e2e/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    # Bind only to the compose network — never expose the test DB to the runner.
    expose:
      - "3306"

  atlan-app:
    depends_on:
      mysql:
        condition: service_healthy
