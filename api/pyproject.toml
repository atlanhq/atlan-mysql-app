[project]
name = "atlan-mysql-api"
version = "2.2.0"
description = "The Atlan MySQL app's handler (auth, preflight, metadata), served by the worker and the consolidated API host"
authors = [{ name = "Atlan Apps Team" }]
requires-python = ">=3.11"
license = "Apache-2.0"
# No worker dependencies: this is what the consolidated host installs per app.
dependencies = [
    # Pinned to an unreleased application-sdk branch commit. Re-pin to a
    # released atlan-application-sdk-api version before this merges.
    "atlan-application-sdk-api[sql,aws] @ git+https://github.com/atlanhq/application-sdk.git@9c41eb79aeeb819ca28c841d38925ed3d4b7f457#subdirectory=packages/api",
    # Sync driver for the handler's client. Already in the lock via aiomysql.
    "pymysql>=1.1.0",
    # caching_sha2_password cold-cache retry, shared with the worker's client.
    # Already in the lock via atlan-application-sdk.
    "tenacity>=8.0.0",
]

[project.entry-points."atlan.app_api"]
mysql = "atlan_mysql_api:handler"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The application-sdk-api dependency is a git direct reference until it is
# pinned to a release.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["atlan_mysql_api"]

# The configmaps the host serves: build_asgi_app(generated_dir=<package>/generated).
# app/generated/ stays the source of truth (the contract toolkit writes it for
# the worker); only its JSON is shipped, so the Python in that tree stays out
# of this package.
[tool.hatch.build.targets.wheel.force-include]
"../app/generated/atlan-connectors-mysql.json" = "atlan_mysql_api/generated/atlan-connectors-mysql.json"
"../app/generated/manifest.json" = "atlan_mysql_api/generated/manifest.json"
"../app/generated/mysql.json" = "atlan_mysql_api/generated/mysql.json"
