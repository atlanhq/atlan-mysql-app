[project]
name = "atlan-mysql-app"
version = "2.0.1"
description = "Atlan MySQL App: Built using Atlan Application SDK"
authors = [{ name = "Atlan Apps Team" }]
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
dependencies = [
    "atlan-application-sdk[daft,iam-auth,sql,workflows,pandas]>=3.13.2,<4",
    "aiomysql>=0.3.0",  # conformance: ignore[D003] loaded dynamically by SQLAlchemy via the "mysql+aiomysql" dialect string, not a direct Python import
    "cryptography>=46.0.5",  # conformance: ignore[D003] required by aiomysql/PyMySQL's caching_sha2_password auth plugin for RSA key exchange with MySQL 8 servers; loaded by the driver
    "poethepoet>=0.34.0",  # conformance: ignore[D003] provides the poe CLI entrypoint used by [tool.poe.tasks] (generate, start-dapr, etc.); invoked as a console script, never imported
    "aiohttp>=3.13.3",  # conformance: ignore[D002,D003] pinned above the SDK's transitive floor (>=3.10.0) for a security fix; consumed transitively, not imported directly
    "protobuf>=6.33.5",  # conformance: ignore[D003] transitive dependency pinned above its floor for a security fix; consumed by lower layers, not imported directly
    "python-multipart>=0.0.22",  # conformance: ignore[D003] transitive dependency pinned above its floor for a security fix; loaded dynamically by Starlette's multipart form parser
    "starlette>=0.49.1",  # conformance: ignore[D003] transitive dependency pinned above its floor for a security fix; used internally by the SDK's HTTP server layer, not imported directly
    "urllib3>=2.6.0",  # conformance: ignore[D003] transitive dependency pinned above its floor for a security fix; consumed internally by requests/httpx, not imported directly
]

# Optional dependencies for specific functionality - Install using: uv sync --extra dev
[project.optional-dependencies]
dev = [
    "atlan-application-sdk-conformance<=1.0.0",
    "pre-commit>=3.8.0",
    "isort>=5.13.2",
    "watchdog>=6.0.0",
    "requests",
]
test = [
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.1",
    "coverage>=7.6.1",
    "requests",
    "testcontainers[mysql]>=4.0.0",
    "docker>=7.0.0",
    "pymysql>=1.1.0",
    "pandas>=2.0.0",
    "pytest-order>=1.3.0",
]

[tool.poe.tasks]
# Regenerate contract artifacts from contract/app.pkl into app/generated/.
# Required by the SDK Certify-app publish gate: `poe generate` must exist
# and leave the working tree clean.
generate = "bash -c 'cd contract && pkl eval -m generated app.pkl && cp generated/app/generated/*.json ../app/generated/ && rm -rf generated'"

# Dapr and Temporal service tasks
# Note: --dapr-http-max-request-size was removed in Dapr CLI v1.13+
# (replaced by --max-body-size, units changed KB→MB). Omitting it
# applies Dapr's default (4 MiB).
start-dapr = "dapr run --enable-api-logging --log-level debug --app-id app --app-port 3000 --scheduler-host-address '' --placement-host-address '' --dapr-http-port 3500 --dapr-grpc-port 50001 --resources-path components"
start-temporal = "temporal server start-dev --db-filename /tmp/temporal.db --headless"
# start-deps backgrounds Dapr + Temporal, then
# block until Temporal's namespace API responds so the app starts against a
# fully-ready workflow server.
start-deps.shell = "poe start-dapr & temporal server start-dev --db-filename /tmp/temporal.db --headless & until temporal operator namespace describe default >/dev/null 2>&1; do sleep 1; done && echo 'Temporal is ready'"
stop-deps.shell = "lsof -ti:3000,3500,7233,50001 | xargs kill -9 2>/dev/null || true"

[tool.poe.tasks.download-components]
interpreter = "python"
shell = """
import application_sdk, pathlib, shutil
src = pathlib.Path(application_sdk.__file__).parent / 'components'
shutil.copytree(src, 'components', dirs_exist_ok=True)
"""


[tool.hatch.build.targets.sdist]
include = ["./**/*.py"]

[tool.hatch.build.targets.wheel]
include = ["./**/*.py"]
packages = [
    "app",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
exclude = [
    ".github/**",
]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "asyncio: marks tests as async (deselect with '-m \"not asyncio\"')",
    "integration: marks tests requiring external services (deselect with '-m \"not integration\"')",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)-8s %(name)s — %(message)s"

[tool.coverage.run]
omit = [
    "tests/**",
    # Auto-generated from contract/app.pkl via the PKL toolkit — no value
    # in testing it (regenerated on every contract change).
    "app/generated/**",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
fail_under = 84

[tool.ruff]
target-version = "py311"
preview = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "PLC0415", "G", "T201", "LOG"]
# G002 suppressed: %-style is correct via the SDK adapter's _format_printf_args bridge
ignore = ["G002"]

[tool.ruff.lint.per-file-ignores]
"tests/unit/test_mysql_app.py" = ["PLC0415"]
".github/**/*.py" = ["T201"]  # CLI scripts — print() is intentional stdout

[tool.uv.sources]
# atlan-application-sdk = { path = "../application-sdk", editable = true }
