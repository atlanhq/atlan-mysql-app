[project]
name = "atlan-mysql-app"
dynamic = ["version"]
description = "Atlan MySQL App: Built using Atlan Application SDK"
authors = [{ name = "Atlan Apps Team", email = "contact@example.com" }]
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
dependencies = [
    "atlan-application-sdk[daft,iam-auth,sql,workflows,pandas]",
    "aiomysql>=0.3.0",
    "cryptography>=46.0.5",
    "poethepoet>=0.34.0",
    "aiohttp>=3.13.3",  # pinned: transitive dep, security fix
    "protobuf>=6.33.5",  # pinned: transitive dep, security fix
    "python-multipart>=0.0.22",  # pinned: transitive dep, security fix
    "starlette>=0.49.1",  # pinned: transitive dep, security fix
    "urllib3>=2.6.0",  # pinned: transitive dep, security fix
]

# Optional dependencies for specific functionality - Install using: uv sync --extra dev
[project.optional-dependencies]
dev = [
    "pre-commit>=3.8.0",
    "isort>=5.13.2",
    "watchdog>=6.0.0",
    "requests"
]
test = [
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.1",
    "coverage>=7.6.1",
    "requests",
    "testcontainers[mysql]>=4.0.0",
    "docker>=7.0.0",
    "pymysql>=1.1.0",
    "pandas>=2.0.0",
    "pyatlan>=9.5.0",
    "pytest-order>=1.3.0",
]

[tool.poe.tasks]
# Dapr and Temporal service tasks
start-dapr = "dapr run --enable-api-logging --log-level debug --app-id app --app-port 3000 --scheduler-host-address '' --placement-host-address '' --dapr-http-max-request-size 1024 --dapr-http-port 3500 --dapr-grpc-port 50001 --resources-path components"
start-temporal = "temporal server start-dev --db-filename /tmp/temporal.db"
start-deps.shell = "poe start-dapr & poe start-temporal &"
stop-deps.shell = "lsof -ti:3000,3500,7233,50001 | xargs kill -9 2>/dev/null || true"

[tool.poe.tasks.download-components]
interpreter = "python"
env = { SDK_VERSION = "v0.1.1rc63" }
shell = """
import pathlib, requests, os, shutil, tarfile, tempfile

# Download components
components_dir = pathlib.Path("components")
components_dir.mkdir(exist_ok=True)

api_url = "https://api.github.com/repos/atlanhq/application-sdk/contents/components"

response = requests.get(api_url, params={"ref": os.getenv("SDK_VERSION")})
response.raise_for_status()

for file_info in response.json():
    if file_info["type"] == "file" and file_info["name"].endswith(".yaml"):
        raw_url = file_info["download_url"]

        file_response = requests.get(raw_url)
        file_response.raise_for_status()

        file_path = components_dir / file_info["name"]
        file_path.write_text(file_response.text)
        print(f"Downloaded: {file_info['name']}")
"""

[tool.hatch.version]
path = "version.txt"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.sdist]
include = ["./**/*.py"]

[tool.hatch.build.targets.wheel]
include = ["./**/*.py"]
packages = [
    "app",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
exclude = [
    ".github/**",
]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "asyncio: marks tests as async (deselect with '-m \"not asyncio\"')",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)-8s %(name)s — %(message)s"

[tool.coverage.run]
omit = [
    "tests/**",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
fail_under = 84

[tool.ruff]
target-version = "py311"
preview = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/unit/test_mysql_app.py" = ["PLC0415"]

[tool.uv.sources]
