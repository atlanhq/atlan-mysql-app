[project]
name = "atlan-mysql-app"
version = "2.1.0"
description = "Atlan MySQL App: Built using Atlan Application SDK"
authors = [{ name = "Atlan Apps Team" }]
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
dependencies = [
    "atlan-application-sdk[iam-auth,sql,workflows,pandas]>=3.27.1,<4.0.0",
    "aiomysql>=0.3.0",  # conformance: ignore[D003] loaded dynamically by SQLAlchemy via the "mysql+aiomysql" dialect string, not a direct Python import
]

# Optional dependencies for specific functionality - Install using: uv sync --extra dev
[project.optional-dependencies]
dev = [
    # Floor + 1.0.0 major boundary, NOT the bare `<=1.0.0` this used to carry.
    # The D-series CI leg resolves the conformance suite from this repo's
    # uv.lock, so a one-sided or exact specifier freezes the ruleset that grades
    # the repo; D011 fails the Dependencies leg on any PR that touches this
    # file. Renovate keeps the resolved version current (0.24.0 today) — widen
    # the ceiling only when the suite ships a 1.x.
    "atlan-application-sdk-conformance>=0.17.0,<1.0.0",
    "pre-commit>=3.8.0",
    "isort>=5.13.2",
    "watchdog>=6.0.0",
    "requests",
    # poe CLI drives [tool.poe.tasks] (generate, start-deps, download-components).
    # A build/dev tool, not a runtime dependency — kept out of the production
    # image (the Dockerfile inlines the component copy instead of calling poe).
    "poethepoet>=0.34.0",
]
test = [
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.1",
    "coverage>=7.6.1",
    "requests",
    "testcontainers[mysql]>=4.0.0",
    "docker>=7.0.0",
    "pymysql>=1.1.0",
    "pandas>=2.0.0",
    "pytest-order>=1.3.0",
]

[tool.poe.tasks]
# Regenerate contract artifacts from contract/app.pkl into app/generated/.
# Required by the SDK Certify-app publish gate: `poe generate` must exist
# and leave the working tree clean.
generate = "bash -c 'cd contract && pkl eval -m generated app.pkl && cp generated/app/generated/*.json ../app/generated/ && rm -rf generated'"

# Dapr and Temporal service tasks
# Note: --dapr-http-max-request-size was removed in Dapr CLI v1.13+
# (replaced by --max-body-size, units changed KB→MB). Omitting it
# applies Dapr's default (4 MiB).
start-dapr = "dapr run --enable-api-logging --log-level debug --app-id app --app-port 3000 --scheduler-host-address '' --placement-host-address '' --dapr-http-port 3500 --dapr-grpc-port 50001 --resources-path components"
start-temporal = "temporal server start-dev --db-filename /tmp/temporal.db --headless"
# start-deps backgrounds Dapr + Temporal, then
# block until Temporal's namespace API responds so the app starts against a
# fully-ready workflow server.
start-deps.shell = "poe start-dapr & temporal server start-dev --db-filename /tmp/temporal.db --headless & until temporal operator namespace describe default >/dev/null 2>&1; do sleep 1; done && echo 'Temporal is ready'"
stop-deps.shell = "lsof -ti:3000,3500,7233,50001 | xargs kill -9 2>/dev/null || true"

[tool.poe.tasks.download-components]
interpreter = "python"
shell = """
import application_sdk, pathlib, shutil
src = pathlib.Path(application_sdk.__file__).parent / 'components'
shutil.copytree(src, 'components', dirs_exist_ok=True)
"""


[tool.hatch.build.targets.sdist]
include = ["./**/*.py"]

[tool.hatch.build.targets.wheel]
include = ["./**/*.py"]
packages = [
    "app",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
exclude = [
    ".github/**",
]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "asyncio: marks tests as async (deselect with '-m \"not asyncio\"')",
    "integration: marks tests requiring external services (deselect with '-m \"not integration\"')",
]
# No log_cli, matching atlan-openapi-app / atlan-metabase-app. The SDK logs
# through loguru's own stdout/stderr sinks (logger_adaptor.py), which the e2e
# action's `-s` already streams — so log_cli added no SDK output, only a
# duplicate of every line. It also attached a handler to the *stdlib* root
# logger, which is where the SDK's non-loguru `logging.warning()` calls land,
# and that surfaced a repeating StorageBindingNotFoundError traceback from the
# e2e harness's observability sink into every job log. The sink itself is fixed
# separately, in application-sdk's sdr-e2e action (FND-964); dropping log_cli
# here is only about keeping the console tier consistent with the fleet.

[tool.coverage.run]
omit = [
    "tests/**",
    # Auto-generated from contract/app.pkl via the PKL toolkit — no value
    # in testing it (regenerated on every contract change).
    "app/generated/**",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
fail_under = 84

[tool.ruff]
target-version = "py311"
preview = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "PLC0415", "G", "T201", "LOG"]
# G002 suppressed: %-style is correct via the SDK adapter's _format_printf_args bridge
ignore = ["G002"]

[tool.ruff.lint.per-file-ignores]
"tests/unit/test_mysql_app.py" = ["PLC0415"]
".github/**/*.py" = ["T201"]  # CLI scripts — print() is intentional stdout

[tool.uv.sources]
# atlan-application-sdk = { path = "../application-sdk", editable = true }
