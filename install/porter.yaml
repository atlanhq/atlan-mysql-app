schemaType: Bundle
schemaVersion: 1.0.1
name: applications/phoenix-mysql-app-main
description: "A CNAB bundle to manage the MySQL App"
registry: "harbor-phoenix.atlan.dev"

mixins:
  - exec
  - docker

install:
  - docker:
      description: "Spin up the MySQL App container on port 8000"
      run:
        image: "harbor-phoenix.atlan.dev/applications/phoenix-mysql-app:main-latest"
        name: "mysql-app"
        ports:
          - host: 8000
            container: 8000
        env:
          TEMPORAL_HOST: "host.docker.internal"
          TEMPORAL_PORT: 7233

upgrade:
  - exec:
      description: "Upgrade the MySQL App"
      command: /bin/bash
      arguments:
        - '-c'
        - 'echo "No upgrade required"'

uninstall:
  - docker:
      description: "Remove mysql-app"
      remove:
        container: mysql-app
        force: true
